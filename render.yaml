databases:
  - name: quickbite-db
    plan: free
services:
  - type: web
    name: quick-bite
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: quickbite-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OWNER_PASSWORD
        sync: false
